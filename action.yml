# restep-action · GitHub Action compuesta para comprobar una API Restep 1 en cada PR.
# Los valores de los inputs llegan a los pasos como variables de entorno, nunca interpolados en
# el script, para que un valor con comillas o $() no se ejecute.
name: Restep check
description: Checks Restep 1 conformance (restep-check) and, given a base discovery document, compatibility (restep-diff)
author: restep
branding:
  icon: check-circle
  color: blue

inputs:
  url:
    description: API root, for example http://localhost:8080/
    required: true
  start-command:
    description: Command that starts the API in the background; the action stops it when done
    required: false
    default: ''
  wait-for:
    description: URL that must respond before starting (defaults to url); only with start-command
    required: false
    default: ''
  wait-timeout:
    description: Maximum seconds to wait for wait-for
    required: false
    default: '60'
  profiles:
    description: Profiles and extensions the API must announce, comma-separated (core,query,writes)
    required: false
    default: ''
  writes:
    description: true to let restep-check create, change and delete its own items (--writes)
    required: false
    default: 'false'
  headers:
    description: Headers for every request, one per line (Authorization, Bearer …)
    required: false
    default: ''
  base-discovery:
    description: Discovery document of the base branch (file or URL) to compare with restep-diff
    required: false
    default: ''
  comment:
    description: true to post the result as a PR comment (always updates the same one)
    required: false
    default: 'false'
  fail-on-error:
    description: true to fail the job if a MUST fails, a profile is missing or there is a breaking change
    required: false
    default: 'true'
  restep-check:
    description: Command that runs restep-check
    required: false
    default: npx --yes restep-check@0.9
  restep-diff:
    description: Command that runs restep-diff
    required: false
    default: npx --yes restep-diff@0.2
  github-token:
    description: Token to comment on the PR (needs pull-requests write)
    required: false
    default: ${{ github.token }}

outputs:
  result:
    description: pass or fail
    value: ${{ steps.report.outputs.result }}
  check-failures:
    description: Number of failing MUST checks
    value: ${{ steps.report.outputs.check-failures }}
  breaking:
    description: true if restep-diff finds breaking changes
    value: ${{ steps.report.outputs.breaking }}
  summary-file:
    description: Path of the Markdown report
    value: ${{ steps.report.outputs.summary-file }}

runs:
  using: composite
  steps:
    - name: Arrancar la API
      id: start
      if: inputs.start-command != ''
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_START_COMMAND: ${{ inputs.start-command }}
        INPUT_WAIT_FOR: ${{ inputs.wait-for }}
        INPUT_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        INPUT_HEADERS: ${{ inputs.headers }}
      run: node "$GITHUB_ACTION_PATH/action.mjs" start

    - name: restep-check
      id: check
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_PROFILES: ${{ inputs.profiles }}
        INPUT_WRITES: ${{ inputs.writes }}
        INPUT_HEADERS: ${{ inputs.headers }}
        INPUT_RESTEP_CHECK: ${{ inputs.restep-check }}
      run: node "$GITHUB_ACTION_PATH/action.mjs" check

    - name: restep-diff
      id: diff
      if: inputs.base-discovery != ''
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_HEADERS: ${{ inputs.headers }}
        INPUT_BASE_DISCOVERY: ${{ inputs.base-discovery }}
        INPUT_RESTEP_DIFF: ${{ inputs.restep-diff }}
      run: node "$GITHUB_ACTION_PATH/action.mjs" diff

    - name: Informe
      id: report
      if: always()
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_BASE_DISCOVERY: ${{ inputs.base-discovery }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/action.mjs" report

    - name: Parar la API
      if: always() && inputs.start-command != ''
      shell: bash
      run: node "$GITHUB_ACTION_PATH/action.mjs" stop
